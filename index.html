<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下遗址回淤监测</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>水下遗址回淤监测系统</h1>
      <div class="muted">标记 · 回淤测量批次 · 清淤建议 同一基准｜同号重传只认首次，校准有效且基准一致才参与判断</div>
    </div>
    <div class="head-actions">
      <button id="btnLeft">左船提交批次</button>
      <button id="btnRight" class="secondary">右船提交批次</button>
      <button id="btnFinalize" class="secondary">完成本轮合并</button>
      <button id="btnRetransmit" class="secondary">重传演示</button>
      <button id="btnFail" class="secondary">演练合并失败</button>
      <button id="btnExport" class="secondary">导出存档</button>
    </div>
  </header>
  <main class="app">
    <section class="panel">
      <div class="map" id="map">
        <div class="wreck"></div>
      </div>
      <div class="legend">
        <span><i class="dot dredging"></i>建议清淤</span>
        <span><i class="dot conflict"></i>冲突待处理</span>
        <span><i class="dot pending"></i>待补测</span>
        <span><i class="dot safe"></i>安全</span>
      </div>
      <div id="summary" class="summary"></div>
    </section>
    <aside class="panel">
      <nav class="tabs" id="tabs">
        <button data-tab="rec" class="active">清淤建议</button>
        <button data-tab="pending">待补测</button>
        <button data-tab="conflict">冲突</button>
        <button data-tab="batches">批次存档</button>
        <button data-tab="rules">规则</button>
      </nav>
      <div id="tabBody"></div>
    </aside>
  </main>
  <div id="toast" class="toast"></div>
  <script src="js/rules.js"></script>
  <script src="js/archive.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
