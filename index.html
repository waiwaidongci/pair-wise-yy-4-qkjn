<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下遗址回淤监测与清淤建议</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    header { padding: 18px 24px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 17px; margin: 10px 0; }
    h3 { margin: 16px 0 8px; font-size: 15px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #64777b; }
    button.mini { padding: 6px 9px; font-size: 12px; margin-top: 6px; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    textarea { min-height: 56px; }
    label { display: block; margin: 9px 0 5px; color: #5c7378; font-size: 13px; }
    .app { display: grid; grid-template-columns: 1fr 400px; gap: 16px; padding: 16px; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 14px; }
    .side { max-height: calc(100vh - 128px); overflow: auto; }
    .map { position: relative; height: calc(100vh - 170px); min-height: 520px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.55); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.35); top: 27%; transform: rotate(-9deg); }
    .marker { position: absolute; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: pointer; padding: 0; }
    .marker.selected { outline: 4px solid rgba(255,234,124,.75); }
    .marker.silt { outline: 3px solid #d9534f; }
    .marker.conflict { outline: 3px solid #e8a13c; }
    .marker.pending { border-style: dashed; opacity: .8; }
    .ceramic { background: #b56c38; } .wood { background: #6c4b2f; } .metal { background: #6e7880; } .unknown { background: #725ca6; }
    .legend { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: #5c7378; flex-wrap: wrap; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
    .dot.red { background: #d9534f; } .dot.orange { background: #e8a13c; } .dot.gray { background: #9fb3b8; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .tabs button { flex: 1; background: #e3eef0; color: #1d6c78; padding: 8px; }
    .tabs button.on { background: #1d6c78; color: #fff; }
    .list { display: grid; gap: 8px; max-height: 300px; overflow: auto; }
    .log { display: grid; gap: 8px; max-height: 240px; overflow: auto; font-size: 12px; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; }
    .list .item { cursor: pointer; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .timeline { display: grid; gap: 8px; max-height: 300px; overflow: auto; }
    .pill { display: inline-block; padding: 3px 8px; border: 1px solid #c9dadc; border-radius: 999px; font-size: 12px; }
    .pill.red { background: #fbe4e4; border-color: #e0b4b4; color: #a33; }
    .pill.orange { background: #fdf0dc; border-color: #e8c48a; color: #8a5a00; }
    .pill.gray { background: #eef1f2; color: #5c7378; }
    .pill.green { background: #e2f4e5; border-color: #b5dcc0; color: #2c6e3f; }
    .muted { color: #5c7378; font-size: 13px; }
    .datum-badge { background: #0f5262; color: #fff; padding: 8px 12px; border-radius: 8px; font-weight: 800; font-size: 13px; white-space: nowrap; }
    .head-right { display: flex; gap: 10px; align-items: center; }
    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #183035; color: #fff; padding: 10px 16px; border-radius: 8px; opacity: 0; transition: .3s; pointer-events: none; max-width: 84%; z-index: 9; }
    #toast.show { opacity: 1; }
    @media (max-width: 980px) { header { display: block; } .app { grid-template-columns: 1fr; } .map { height: 520px; } .side { max-height: none; } }
  </style>
</head>
<body>
  <header>
    <div><h1>水下遗址回淤监测</h1><div class="muted">标记 · 回淤测量批次 · 清淤建议，同一基准面</div></div>
    <div class="head-right">
      <span class="datum-badge" id="datumBadge"></span>
      <button id="datumBtn" class="secondary">变更基准</button>
      <button id="exportBtn">导出JSON</button>
    </div>
  </header>
  <main class="app">
    <section class="panel">
      <div class="map" id="map"><div class="wreck"></div></div>
      <div class="legend">
        <span><i class="dot red"></i>建议清淤</span>
        <span><i class="dot orange"></i>冲突待处理</span>
        <span><i class="dot gray"></i>待补测</span>
        <span class="muted">点击空白处添加标记，点击标记编辑</span>
      </div>
    </section>
    <aside class="panel side">
      <nav class="tabs">
        <button data-tab="marks" class="on">标记</button>
        <button data-tab="measure">回淤测量</button>
        <button data-tab="dredge">清淤建议</button>
      </nav>

      <section id="tab-marks" class="tabpage">
        <div class="toolbar">
          <select id="filter"><option value="">全部类型</option><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
          <select id="view"><option value="list">标记列表</option><option value="timeline">潜次时间线</option></select>
        </div>
        <form id="form">
          <h2>标记信息</h2>
          <input name="mid" type="hidden">
          <label>编号</label><input name="code" required>
          <label>类型</label><select name="type"><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
          <label>潜次</label><input name="dive" placeholder="例如DIVE-04" required>
          <label>深度</label><input name="depth" placeholder="例如18.4m" required>
          <label>朝向</label><input name="orientation" placeholder="例如东北偏北">
          <label>保存状态</label><input name="condition" placeholder="例如表面附着贝类">
          <label>备注</label><textarea name="note"></textarea>
          <div class="toolbar"><button>保存标记</button><button type="button" id="deleteBtn" class="secondary">删除</button></div>
          <div class="muted">位置或基准一变，清淤建议立即失效重算，原读数留查。</div>
        </form>
        <h2 id="listTitle">标记列表</h2>
        <div id="list" class="list"></div>
      </section>

      <section id="tab-measure" class="tabpage" style="display:none">
        <form id="mform">
          <h2>提交回淤测量</h2>
          <div class="muted">基准面版本：<b id="datumNow"></b>（随当前基准自动入账）</div>
          <label>标记</label><select name="markerId"></select>
          <div class="row">
            <div><label>测量船</label><select name="ship"><option value="A">A船</option><option value="B">B船</option></select></div>
            <div><label>回淤厚度（m）</label><input name="thickness" type="number" step="0.01" min="0" required></div>
          </div>
          <label>操作号（同号重传只认首次）</label><input name="opId" required>
          <label>设备校准号</label><select name="calibrationId"></select>
          <label>测量时刻</label><input name="measuredAt" type="datetime-local" required>
          <label>来源</label><select name="origin"><option value="field">现场</option><option value="office">岸上回填</option></select>
          <div class="toolbar" style="margin-top:10px"><button>提交测量（成批入账）</button><button type="button" id="demoBtn" class="secondary">演示两船批次</button></div>
          <div class="toolbar"><button type="button" id="faultBtn" class="secondary">模拟故障批次</button><button type="button" id="recoverBtn" class="secondary">恢复到最后确认</button></div>
        </form>
        <form id="cform">
          <h2>校准登记</h2>
          <div class="row">
            <div><label>校准号</label><input name="cid" placeholder="CAL-C1" required></div>
            <div><label>设备</label><input name="device" placeholder="C船测深仪" required></div>
          </div>
          <div class="row">
            <div><label>生效日期</label><input name="validFrom" type="date" required></div>
            <div><label>失效日期</label><input name="validUntil" type="date" required></div>
          </div>
          <div class="toolbar" style="margin-top:10px"><button>登记校准</button></div>
        </form>
        <h3>校准台账</h3>
        <div id="calList" class="list"></div>
        <h3>批次存档</h3>
        <div id="batchList" class="list"></div>
      </section>

      <section id="tab-dredge" class="tabpage" style="display:none">
        <h2>当前清淤建议</h2>
        <div id="recNow" class="list"></div>
        <div id="conflictList"></div>
        <div id="pendingList"></div>
        <div id="recHistory"></div>
        <h3>审计日志</h3>
        <div id="auditLog" class="log"></div>
      </section>
    </aside>
  </main>
  <div id="toast"></div>
  <script src="js/rules.js"></script>
  <script src="js/archive.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
